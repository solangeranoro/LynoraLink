# ---------------------------------------------------------------------------
# Render Blueprint — LynoraLink API
# Déploie uniquement le service API ; le frontend est hébergé séparément.
# La base PostgreSQL est hébergée sur Neon (DATABASE_URL / DIRECT_URL).
# ---------------------------------------------------------------------------
services:
  - type: web
    name: lynoralink-backend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate --schema backend/prisma/schema.prisma && npx prisma migrate deploy --schema backend/prisma/schema.prisma && npm run build --workspace lynoralink-backend
    startCommand: npm run start --workspace lynoralink-backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CODING_WS_URL
        sync: false
  - type: web
    name: lynoralink-collaboration
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run start:collaboration --workspace lynoralink-backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
